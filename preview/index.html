<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>koborin.ai</title>
<link rel="icon" href="../icon/favicon.svg">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0b0d12; color: #eceae5; font: 14px/1.45 Geist, "Noto Sans JP", sans-serif; }
main { padding: 28px 32px 40px; display: grid; gap: 20px; }
h1, h2 { font-weight: 500; margin: 0; }
h1 { font-size: 15px; }
h2 { font-size: 12px; }
section { display: grid; gap: 12px; padding: 16px; }
.light { background: #faf9f6; color: #16161a; }
.row, .swatches { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
figure { margin: 0; display: flex; flex-wrap: wrap; align-items: end; gap: 8px 10px; }
figcaption { flex-basis: 100%; }
figcaption { font: 11px/1.3 "Geist Mono", "Noto Sans JP", ui-monospace, monospace; }
.dark figcaption { color: #eceae56b; }
.light figcaption { color: #16161a73; }
.swatch { display: grid; grid-template-columns: 28px auto; gap: 8px; align-items: center; font: 11px/1.3 "Geist Mono", "Noto Sans JP", ui-monospace, monospace; }
.chip { width: 28px; height: 28px; display: block; box-shadow: inset 0 0 0 1px currentColor; }
img { display: block; }
img.scale { height: 96px; width: auto; }
img.lockup { height: 72px; width: auto; }
img.avatar { height: 140px; width: auto; }
img.og { width: min(100%, 760px); height: auto; }
</style>
</head>
<body>
<main>
<h1>koborin.ai</h1>
<section class="dark">
<h2>Dark</h2>
<div class="swatches"><div class="swatch"><span class="chip" style="background:#0b0d12"></span><span>bg #0b0d12</span></div><div class="swatch"><span class="chip" style="background:#eceae5"></span><span>fg #eceae5</span></div><div class="swatch"><span class="chip" style="background:#d5dae1"></span><span>accent #d5dae1</span></div><div class="swatch"><span class="chip" style="background:#eceae56b"></span><span>muted #eceae56b</span></div></div>
<div class="row">
<figure>
<img class="scale" src="../mark/mark-dark.svg" alt="mark/mark-dark.svg">
<figcaption>mark/mark-dark.svg</figcaption>
</figure>
<figure>
<img class="scale" src="../mark/mark-dark-512.png" alt="mark/mark-dark-512.png">
<figcaption>mark/mark-dark-512.png</figcaption>
</figure>
<figure>
<img class="lockup" src="../lockup/lockup-dark.svg" alt="lockup/lockup-dark.svg">
<figcaption>lockup/lockup-dark.svg</figcaption>
</figure>
<figure>
<img class="lockup" src="../lockup/lockup-dark-256.png" alt="lockup/lockup-dark-256.png">
<figcaption>lockup/lockup-dark-256.png</figcaption>
</figure>
</div>
</section>
<section class="light">
<h2>Light</h2>
<div class="swatches"><div class="swatch"><span class="chip" style="background:#faf9f6"></span><span>bg #faf9f6</span></div><div class="swatch"><span class="chip" style="background:#16161a"></span><span>fg #16161a</span></div><div class="swatch"><span class="chip" style="background:#4a5260"></span><span>accent #4a5260</span></div><div class="swatch"><span class="chip" style="background:#16161a73"></span><span>muted #16161a73</span></div></div>
<div class="row">
<figure>
<img class="scale" src="../mark/mark-light.svg" alt="mark/mark-light.svg">
<figcaption>mark/mark-light.svg</figcaption>
</figure>
<figure>
<img class="scale" src="../mark/mark-light-512.png" alt="mark/mark-light-512.png">
<figcaption>mark/mark-light-512.png</figcaption>
</figure>
<figure>
<img class="lockup" src="../lockup/lockup-light.svg" alt="lockup/lockup-light.svg">
<figcaption>lockup/lockup-light.svg</figcaption>
</figure>
<figure>
<img class="lockup" src="../lockup/lockup-light-256.png" alt="lockup/lockup-light-256.png">
<figcaption>lockup/lockup-light-256.png</figcaption>
</figure>
<figure>
<img src="../icon/favicon.svg" alt="icon/favicon.svg at 16" width="16" height="16">
<img src="../icon/favicon.svg" alt="icon/favicon.svg at 32" width="32" height="32">
<img src="../icon/favicon.svg" alt="icon/favicon.svg at 48" width="48" height="48">
<figcaption>icon/favicon.svg at 16, 32, and 48</figcaption>
</figure>
<figure>
<img src="../icon/favicon.ico" alt="icon/favicon.ico" width="48" height="48">
<figcaption>icon/favicon.ico</figcaption>
</figure>
<figure>
<img class="scale" src="../icon/apple-touch-icon.png" alt="icon/apple-touch-icon.png">
<figcaption>icon/apple-touch-icon.png</figcaption>
</figure>
<figure>
<img class="scale" src="../icon/icon-512.png" alt="icon/icon-512.png">
<figcaption>icon/icon-512.png</figcaption>
</figure>
<figure>
<img class="avatar" src="../avatar/avatar-1024.png" alt="avatar/avatar-1024.png">
<figcaption>avatar/avatar-1024.png</figcaption>
</figure>
<figure>
<img class="og" src="../ogp/default.png" alt="ogp/default.png">
<figcaption>ogp/default.png</figcaption>
</figure>
</div>
</section>
</main>
</body>
</html>
